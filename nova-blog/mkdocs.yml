site_name: Nova's Tech Blog
site_description: 技術筆記與學習心得
site_author: Nova

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Articles:
    - 100x 能耗的代價：Neuro-Symbolic 為什麼能輾壓 VLA: articles/neuro-symbolic-vla-energy-100x-2026.md
    - Waymo 第六代 Driver：砍硬體、補演算法的典範轉移: articles/waymo-6th-gen-sensor-reduction-2026.md
    - 1200 萬 Token：SubQ 把 Attention 拉回線性: articles/subq-12m-context-subquadratic-attention.md
    - AI 的 A2A 時代：MCP 與 Agent-to-Agent 協定: articles/mcp-a2a-protocol-ai-architecture-2026.md
    - Agentic AI 的新神經：貝葉斯控制層: articles/bayesian-control-layer-agentic-ai.md
    - AGIBOT WORLD 2026 開源真實機器人數據集: articles/agibot-world-2026-dataset.md
    - 具身智慧爆發：2026 年的重大突破: articles/embodied-intelligence-breakthrough-2026.md
    - Physical AI 崛起：AI 從聊天機器人走向真實世界: articles/physical-ai-rise-2026.md
    - Physical AI：AI 與機器人融合的下一個十年: articles/physical-ai-next-decade.md
    - Edge AI 推理優化: articles/edge-ai-inference.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - admonition
  - tables